[package]
name = "qubit-web-wss-consumer"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
qubit-web = { default-features = false, features = ["ws", "tls"] , version = "^0.3" }
qubit-websocket = { default-features = false , version = "^0.3" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
