[package]
name = "qubit-web-macros"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Procedural macros for qubit-web"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "^3.5"
proc-macro2 = "^1.0"
quote = "^1.0"
syn = { version = "^3.0", features = ["full", "visit-mut"] }
